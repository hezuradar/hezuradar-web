<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Inter, Arial, sans-serif">
  <title>Marcar la altura de la cejuela con un lápiz apoyado en los trastes, dibujado a escala</title>
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf9ef"/><stop offset="1" stop-color="#e6d6b4"/></linearGradient>
    <linearGradient id="boneH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe3c8"/><stop offset=".5" stop-color="#fdf9ef"/><stop offset="1" stop-color="#e3d2ad"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f3626"/><stop offset="1" stop-color="#2c1d13"/></linearGradient>
    <linearGradient id="spruce" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e2bb"/><stop offset="1" stop-color="#dfbf8a"/></linearGradient>
    <linearGradient id="mahog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97643c"/><stop offset="1" stop-color="#6b4226"/></linearGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b07a"/><stop offset="1" stop-color="#b98a55"/></linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2b1e"/><stop offset="1" stop-color="#18100a"/></linearGradient>
    <linearGradient id="nickel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7f9"/><stop offset=".55" stop-color="#bcc6cd"/><stop offset="1" stop-color="#8c99a2"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8890"/><stop offset=".5" stop-color="#d6dde2"/><stop offset="1" stop-color="#6c767d"/></linearGradient>
    <radialGradient id="ballg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f2c76a"/><stop offset="1" stop-color="#9b7426"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4076AA"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#c9b48a" stroke-width="2"/></pattern>
  </defs>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="215.0" y="30.0" font-size="13" font-weight="700" fill="#62727d" text-anchor="middle">VISTA LATERAL</text>
  <path d="M70.0,262.0 L430,262.0 L430,342.0 L80.0,342.0 Z" fill="url(#mahog)" stroke="#1c2b36" stroke-width="1.5"/>
  <path d="M70.0,262.0 L10,277.0 L10,337.0 L80.0,342.0 Z" fill="url(#mahog)" stroke="#1c2b36" stroke-width="1.5"/>
  <rect x="94.0" y="238.0" width="336.0" height="24.0" fill="url(#rose)" stroke="#1c2b36" stroke-width="1.5"/>
  <path d="M233.8,238.0 Q233.8,233.2 238.8,233.2 Q243.8,233.2 243.8,238.0 Z" fill="url(#nickel)" stroke="#1c2b36" stroke-width=".8"/>
  <path d="M370.5,238.0 Q370.5,233.2 375.5,233.2 Q380.5,233.2 380.5,238.0 Z" fill="url(#nickel)" stroke="#1c2b36" stroke-width=".8"/>
  <rect x="70.0" y="222.0" width="24.0" height="40.0" fill="url(#boneH)" stroke="#4076AA" stroke-width="2"/>
  <rect x="104.0" y="219.2" width="250" height="14.0" fill="#f2c94c" stroke="#1c2b36" stroke-width="1.2"/>
  <polygon points="104.0,219.2 104.0,233.2 95.0,232.2" fill="#f0d7ae" stroke="#1c2b36" stroke-width="1"/>
  <line x1="95.0" y1="232.6" x2="352.0" y2="232.6" stroke="#33424c" stroke-width="1.6"/>
  <line x1="70.0" y1="233.2" x2="94.0" y2="233.2" stroke="#d9534f" stroke-width="2"/>
  <path d="M82.0,222.0 L82.0,90.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="82.0" cy="222.0" r="2.8" fill="#4076AA"/>
  <text x="82.0" y="64.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">Cejuela en bruto</text>
  <text x="82.0" y="82.0" font-size="13" fill="#62727d" text-anchor="middle">6 × 10 mm</text>
  <path d="M250.0,219.2 L250.0,150.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="250.0" cy="219.2" r="2.8" fill="#4076AA"/>
  <text x="250.0" y="124.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">Lápiz lijado por la mitad,</text>
  <text x="250.0" y="142.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">apoyado en los trastes</text>
  <text x="215.0" y="372.0" font-size="13" fill="#62727d" text-anchor="middle">La mina marca en la cejuela la altura exacta de los trastes</text>
  <line x1="452" y1="50" x2="452" y2="380" stroke="#e1e8ed" stroke-width="2"/>
  <text x="605.0" y="30.0" font-size="13" font-weight="700" fill="#62727d" text-anchor="middle">LA PIEZA VISTA DE FRENTE</text>
  <clipPath id="cp"><rect x="478.5" y="190.0" width="253.0" height="46.0"/></clipPath>
  <rect x="478.5" y="190.0" width="253.0" height="46.0" fill="url(#bone)" stroke="#1c2b36" stroke-width="2"/>
  <path d="M476.5,188.0 L733.5,188.0 L733.5,200.6 Q605,191.4 476.5,200.6 Z" fill="url(#hatch)" clip-path="url(#cp)"/>
  <path d="M478.5,200.6 Q605,191.4 731.5,200.6" fill="none" stroke="#1c2b36" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M478.5,207.5 Q605,198.3 731.5,207.5" fill="none" stroke="#d9534f" stroke-width="2"/>
  <line x1="506.1" y1="176.0" x2="506.1" y2="250.0" stroke="#9aa7b0" stroke-dasharray="3 3"/>
  <line x1="703.9" y1="176.0" x2="703.9" y2="250.0" stroke="#9aa7b0" stroke-dasharray="3 3"/>
  <line x1="509.1" y1="262.0" x2="700.9" y2="262.0" stroke="#4076AA" stroke-width="1.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="605.0" y="284.0" font-size="13" fill="#62727d" text-anchor="middle">43 mm: ancho del mástil</text>
  <path d="M711.5,196.0 L721.5,120.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="711.5" cy="196.0" r="2.8" fill="#4076AA"/>
  <text x="721.5" y="112.0" font-size="14" font-weight="700" fill="#1c2b36" text-anchor="middle">Sobrante</text>
  <path d="M508.5,206.5 L488.5,135.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="508.5" cy="206.5" r="2.8" fill="#4076AA"/>
  <text x="474.5" y="128.0" font-size="14" font-weight="700" fill="#d9534f">Marca del lápiz</text>
  <text x="605.0" y="326.0" font-size="13" fill="#62727d" text-anchor="middle">Corta por la línea discontinua,</text>
  <text x="605.0" y="344.0" font-size="13" fill="#62727d" text-anchor="middle">1-2 mm por encima de la marca roja</text>
</svg>
