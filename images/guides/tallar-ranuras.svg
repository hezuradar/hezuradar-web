  <text x="474.0" y="96.0" font-size="15" font-weight="700" fill="#1c2b36">La cuerda apoya solo en el</text>
  <text x="474.0" y="114.0" font-size="15" font-weight="700" fill="#1c2b36">borde delantero de la cejuela</text>
  <path d="M238.0,211.8 L120.0,110.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="238.0" cy="211.8" r="2.8" fill="#4076AA"/>
  <text x="20.0" y="82.0" font-size="15" font-weight="700" fill="#1c2b36">Fondo de la ranura inclinado</text>
  <text x="20.0" y="100.0" font-size="15" font-weight="700" fill="#1c2b36">hacia el clavijero</text>
  <text x="110.0" y="330.0" font-size="13" fill="#f6eedc" text-anchor="middle">Pala</text>
  <text x="250.0" y="292.0" font-size="13" fill="#f6eedc" text-anchor="middle">Cejuela</text>
  <text x="520.0" y="246.0" font-size="13" fill="#f6eedc" text-anchor="middle">Diapasón</text>
  <text x="642.0" y="246.0" font-size="12" fill="#f6eedc" text-anchor="middle">traste 1</text>
  <text x="740.0" y="30.0" font-size="13" fill="#62727d" text-anchor="end">Escala 10:1 · cuerda de 1 mm, cejuela de 6 mm</text>
</svg>
