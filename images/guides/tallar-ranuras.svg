<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Inter, Arial, sans-serif">
  <title>Corte a escala de la cejuela: el fondo de la ranura baja hacia el clavijero y la cuerda apoya en el borde delantero</title>
  <defs>
