  <path d="M760,188.0 L280.0,188.0 L0,257.8" fill="none" stroke="url(#steel)" stroke-width="10.0" stroke-linejoin="round"/>
  <path d="M760,188.0 L280.0,188.0 L0,257.8" fill="none" stroke="#5f6a71" stroke-width="1" stroke-opacity=".6"/>
  <circle cx="280.0" cy="193.0" r="4" fill="#d9534f"/>
  <path d="M282.0,191.0 L470.0,110.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
