  <path d="M220.0,270.0 L0,324.9 L0,420 L220.0,420 Z" fill="url(#mahog)"/>
  <line x1="220.0" y1="270.0" x2="0" y2="324.9" stroke="#1c2b36" stroke-width="1.5"/>
  <rect x="280.0" y="210.0" width="480.0" height="60.0" fill="url(#rose)" stroke="#1c2b36" stroke-width="1.5"/>
  <path d="M630.0,210.0 Q630.0,198.0 642.0,198.0 Q654.0,198.0 654.0,210.0 Z" fill="url(#nickel)" stroke="#1c2b36" stroke-width="1"/>
  <rect x="220.0" y="188.0" width="60.0" height="82.0" fill="url(#boneH)" stroke="#1c2b36" stroke-width="2"/>
  <polygon points="220.0,188.0 280.0,188.0 280.0,193.0 220.0,214.8" fill="#ffffff" stroke="#1c2b36" stroke-width="1.2" stroke-dasharray="5 4"/>
