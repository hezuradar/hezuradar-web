<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, Arial, sans-serif">
  <title>Las tres medidas de una cejuela o selleta: largo, grosor y alto</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4076AA"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#ffffff"/>
  <!-- Pieza -->
  <polygon points="130,130 530,130 580,95 180,95" fill="#fbf6ea" stroke="#1c2b36" stroke-width="2"/>
  <polygon points="530,130 580,95 580,185 530,220" fill="#e8dcc0" stroke="#1c2b36" stroke-width="2"/>
  <rect x="130" y="130" width="400" height="90" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
  <g stroke="#d9c9a6" stroke-width="1.5" fill="none">
    <path d="M150,160 C230,152 300,168 380,158 S500,150 515,156"/>
    <path d="M150,192 C250,186 330,200 420,190 S500,184 515,188"/>
  </g>
  <!-- Largo -->
  <line x1="130" y1="232" x2="130" y2="262" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="530" y1="232" x2="530" y2="262" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="136" y1="252" x2="524" y2="252" stroke="#4076AA" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2b36">Largo</text>
  <text x="330" y="304" text-anchor="middle" font-size="13" fill="#62727d">ancho del mástil o largo de la ranura del puente</text>
  <!-- Alto -->
  <line x1="88" y1="130" x2="122" y2="130" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="88" y1="220" x2="122" y2="220" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="100" y1="136" x2="100" y2="214" stroke="#4076AA" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="80" y="170" text-anchor="end" font-size="18" font-weight="700" fill="#1c2b36">Alto</text>
  <text x="80" y="190" text-anchor="end" font-size="13" fill="#62727d">deja margen</text>
  <!-- Grosor -->
  <line x1="538" y1="226" x2="556" y2="240" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="588" y1="191" x2="606" y2="205" stroke="#9aa7b0" stroke-width="1"/>
  <line x1="554" y1="232" x2="597" y2="202" stroke="#4076AA" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="612" y="232" font-size="18" font-weight="700" fill="#1c2b36">Grosor</text>
  <text x="612" y="252" font-size="13" fill="#62727d">= ancho de</text>
  <text x="612" y="268" font-size="13" fill="#62727d">la ranura</text>
  <text x="355" y="52" text-anchor="middle" font-size="14" fill="#62727d">Las medidas se dan en milímetros, por ejemplo 55 × 6 × 10 mm</text>
</svg>
