<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif">
  <title>La base de la selleta debe apoyar entera en el fondo de la ranura del puente</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <line x1="380" y1="20" x2="380" y2="280" stroke="#e1e8ed" stroke-width="2"/>
  <!-- Bien -->
  <g transform="translate(30,0)">
    <text x="160" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">✓ Base plana</text>
    <rect x="10" y="150" width="300" height="70" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
    <rect x="40" y="150" width="240" height="40" fill="#2a1c12"/>
    <path d="M40,110 Q160,96 280,110 L280,190 L40,190 Z" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
    <rect x="40" y="190" width="240" height="4" fill="#4076AA"/>
    <text x="160" y="250" text-anchor="middle" font-size="14" fill="#33424c">Apoya en toda su longitud</text>
  </g>
  <!-- Mal -->
  <g transform="translate(410,0)">
    <text x="160" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#c0392b">✗ Base curvada o torcida</text>
    <rect x="10" y="150" width="300" height="70" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
    <rect x="40" y="150" width="240" height="40" fill="#2a1c12"/>
    <path d="M40,104 Q160,90 280,104 L280,186 Q160,174 40,190 Z" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
    <path d="M60,190 Q160,176 270,187" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="160" y="250" text-anchor="middle" font-size="14" fill="#33424c">Quedan huecos: peor transmisión</text>
    <text x="160" y="270" text-anchor="middle" font-size="14" fill="#33424c">y, con pastilla, cuerdas desiguales</text>
  </g>
  <text x="190" y="140" text-anchor="middle" font-size="13" fill="#62727d">selleta</text>
  <text x="570" y="134" text-anchor="middle" font-size="13" fill="#62727d">selleta</text>
</svg>
