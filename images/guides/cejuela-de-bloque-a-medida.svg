<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" font-family="Inter, Arial, sans-serif">
  <title>Cuatro pasos para hacer una cejuela de hueso a medida: pieza en bruto, largo y grosor, perfil y ranuras, y pulida y montada</title>
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf9ef"/><stop offset="1" stop-color="#e6d6b4"/></linearGradient>
    <linearGradient id="boneH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe3c8"/><stop offset=".5" stop-color="#fdf9ef"/><stop offset="1" stop-color="#e3d2ad"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f3626"/><stop offset="1" stop-color="#2c1d13"/></linearGradient>
    <linearGradient id="spruce" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e2bb"/><stop offset="1" stop-color="#dfbf8a"/></linearGradient>
    <linearGradient id="mahog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97643c"/><stop offset="1" stop-color="#6b4226"/></linearGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b07a"/><stop offset="1" stop-color="#b98a55"/></linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2b1e"/><stop offset="1" stop-color="#18100a"/></linearGradient>
    <linearGradient id="nickel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7f9"/><stop offset=".55" stop-color="#bcc6cd"/><stop offset="1" stop-color="#8c99a2"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8890"/><stop offset=".5" stop-color="#d6dde2"/><stop offset="1" stop-color="#6c767d"/></linearGradient>
    <radialGradient id="ballg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f2c76a"/><stop offset="1" stop-color="#9b7426"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4076AA"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#c9b48a" stroke-width="2"/></pattern>
  </defs>
  <rect width="760" height="278" fill="#ffffff"/>
  <rect x="23.5" y="139.0" width="143.0" height="26.0" fill="url(#bone)" stroke="#1c2b36" stroke-width="1.6"/>
  <text x="95.0" y="40.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">1. Pieza en bruto</text>
  <text x="95.0" y="59.0" font-size="13" fill="#62727d" text-anchor="middle">55 × 6 × 10 mm</text>
  <line x1="176.0" y1="151.0" x2="204.0" y2="151.0" stroke="#4076AA" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="229.1" y="139.0" width="111.8" height="26.0" fill="url(#bone)" stroke="#1c2b36" stroke-width="1.6"/>
  <rect x="213.5" y="139.0" width="15.6" height="26.0" fill="none" stroke="#9aa7b0" stroke-dasharray="3 3"/>
  <rect x="340.9" y="139.0" width="15.6" height="26.0" fill="none" stroke="#9aa7b0" stroke-dasharray="3 3"/>
  <text x="285.0" y="40.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">2. Largo y grosor</text>
  <text x="285.0" y="59.0" font-size="13" fill="#62727d" text-anchor="middle">ajustada al mástil</text>
  <line x1="366.0" y1="151.0" x2="394.0" y2="151.0" stroke="#4076AA" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M419.1,165.0 L419.1,148.1 Q419.1,145.5 424.3,145.5 Q475.0,140.3 525.7,145.5 Q530.9,145.5 530.9,148.1 L530.9,165.0 Z" fill="url(#bone)" stroke="#1c2b36" stroke-width="1.6"/>
  <path d="M427.9,144.5 L429.5,146.5 L431.1,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M446.1,144.5 L447.7,146.5 L449.3,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M464.3,144.5 L465.9,146.5 L467.5,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M482.5,144.5 L484.1,146.5 L485.7,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M500.7,144.5 L502.3,146.5 L503.9,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M518.9,144.5 L520.5,146.5 L522.1,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <text x="475.0" y="40.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">3. Perfil y ranuras</text>
  <text x="475.0" y="59.0" font-size="13" fill="#62727d" text-anchor="middle">con limas</text>
  <line x1="556.0" y1="151.0" x2="584.0" y2="151.0" stroke="#4076AA" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M609.1,165.0 L609.1,148.1 Q609.1,145.5 614.3,145.5 Q665.0,140.3 715.7,145.5 Q720.9,145.5 720.9,148.1 L720.9,165.0 Z" fill="url(#boneH)" stroke="#4076AA" stroke-width="2.2"/>
  <path d="M617.9,144.5 L619.5,146.5 L621.1,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M636.1,144.5 L637.7,146.5 L639.3,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M654.3,144.5 L655.9,146.5 L657.5,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M672.5,144.5 L674.1,146.5 L675.7,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M690.7,144.5 L692.3,146.5 L693.9,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <path d="M708.9,144.5 L710.5,146.5 L712.1,144.5" fill="#ffffff" stroke="#1c2b36" stroke-width="1"/>
  <rect x="603.1" y="149.4" width="123.8" height="15.6" fill="url(#rose)" stroke="#1c2b36" stroke-width="1.2"/>
  <rect x="603.1" y="165.0" width="123.8" height="36.4" fill="url(#mahog)" stroke="#1c2b36" stroke-width="1.2"/>
  <circle cx="619.5" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <circle cx="637.7" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <circle cx="655.9" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <circle cx="674.1" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <circle cx="692.3" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <circle cx="710.5" cy="145.1" r="1.4" fill="url(#steel)" stroke="#1c2b36" stroke-width=".6"/>
  <text x="665.0" y="40.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">4. Pulida y montada</text>
  <text x="665.0" y="59.0" font-size="13" fill="#62727d" text-anchor="middle">a medida de tu guitarra</text>
  <text x="380.0" y="262.0" font-size="13" fill="#62727d" text-anchor="middle">Las cuatro piezas, vistas de frente y a la misma escala. Cada cejuela se ajusta a la guitarra en la que va.</text>
</svg>
