<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif">
  <title>Rebajar la selleta 1 mm baja la altura de las cuerdas en el traste 12 unos 0,5 mm</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- Diapasón y cuerpo -->
  <rect x="60" y="200" width="380" height="16" fill="#4a3324" stroke="#1c2b36" stroke-width="2"/>
  <rect x="440" y="206" width="280" height="22" fill="#e9cfa3" stroke="#1c2b36" stroke-width="2"/>
  <rect x="610" y="186" width="60" height="20" rx="4" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
  <!-- Cejuela -->
  <rect x="50" y="178" width="12" height="38" fill="#f6eedc" stroke="#1c2b36" stroke-width="1.5"/>
  <!-- Traste 12 -->
  <rect x="345" y="193" width="7" height="7" fill="#c9d4db" stroke="#1c2b36" stroke-width="1"/>
  <!-- Selleta alta y rebajada -->
  <rect x="632" y="122" width="10" height="64" fill="#f6eedc" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="628" y1="142" x2="646" y2="142" stroke="#4076AA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Cuerdas -->
  <line x1="56" y1="180" x2="637" y2="122" stroke="#33424c" stroke-width="2.5"/>
  <line x1="56" y1="180" x2="637" y2="142" stroke="#4076AA" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- Cotas -->
  <line x1="690" y1="122" x2="690" y2="142" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="684" y1="122" x2="696" y2="122" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="684" y1="142" x2="696" y2="142" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="702" y="128" font-size="14" font-weight="700" fill="#1c2b36">1 mm</text>
  <text x="702" y="146" font-size="12" fill="#62727d">selleta</text>
  <line x1="348" y1="151" x2="348" y2="161" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="340" y1="151" x2="356" y2="151" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="340" y1="161" x2="356" y2="161" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="356" y1="156" x2="420" y2="100" stroke="#4076AA" stroke-width="1.6"/>
  <text x="424" y="92" font-size="15" font-weight="700" fill="#1c2b36">≈ 0,5 mm en el traste 12</text>
  <text x="424" y="110" font-size="13" fill="#62727d">la mitad de lo que rebajas en la selleta</text>
  <text x="56" y="244" text-anchor="middle" font-size="13" fill="#62727d">Cejuela</text>
  <text x="348" y="244" text-anchor="middle" font-size="13" fill="#62727d">Traste 12</text>
  <text x="637" y="250" text-anchor="middle" font-size="13" fill="#62727d">Selleta</text>
  <text x="380" y="284" text-anchor="middle" font-size="13" fill="#62727d">El traste 12 está a mitad de camino entre la cejuela y la selleta (escala exagerada)</text>
</svg>
