<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" font-family="Inter, Arial, sans-serif">
  <title>Comprobar la altura de la cejuela pisando la cuerda en el tercer traste, con los trastes a escala</title>
  <defs>
