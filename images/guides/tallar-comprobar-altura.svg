  <text x="266.0" y="88.0" font-size="13" fill="#62727d">debe quedar una holgura mínima</text>
  <text x="518.1" y="126.0" font-size="15" font-weight="700" fill="#1c2b36" text-anchor="middle">Pisa justo detrás del traste 3</text>
  <text x="251.0" y="372.0" font-size="13" font-weight="600" fill="#62727d" text-anchor="middle">1</text>
  <text x="421.9" y="372.0" font-size="13" font-weight="600" fill="#62727d" text-anchor="middle">2</text>
  <text x="583.1" y="372.0" font-size="13" font-weight="600" fill="#62727d" text-anchor="middle">3</text>
