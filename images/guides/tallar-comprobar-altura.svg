  <rect x="0" y="280.0" width="760" height="70.0" fill="url(#mahog)" stroke="#1c2b36" stroke-width="1.5"/>
  <rect x="40.0" y="239.0" width="30.0" height="41.0" fill="url(#boneH)" stroke="#1c2b36" stroke-width="1.5"/>
  <path d="M245.0,250.0 Q245.0,244.0 251.0,244.0 Q257.0,244.0 257.0,250.0 Z" fill="url(#nickel)" stroke="#1c2b36" stroke-width=".8"/>
