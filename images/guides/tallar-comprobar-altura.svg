  <text x="55.0" y="372.0" font-size="13" fill="#62727d" text-anchor="middle">Cejuela</text>
  <text x="380.0" y="395.0" font-size="13" fill="#62727d" text-anchor="middle">Posiciones de los trastes a escala real (escala de 645 mm)</text>
