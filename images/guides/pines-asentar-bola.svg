  <text x="440.0" y="192.0" font-size="13" fill="#f6eedc" text-anchor="middle">Puente</text>
  <text x="380.0" y="402.0" font-size="13" fill="#62727d" text-anchor="middle">Corte a escala 8:1 (puente de 9 mm de alto, tapa de 2,8 mm)</text>
