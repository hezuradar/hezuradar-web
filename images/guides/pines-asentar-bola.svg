  <circle cx="60.0" cy="221.2" r="2.8" fill="#4076AA"/>
  <text x="60.0" y="298.0" font-size="13" fill="#62727d" text-anchor="middle">Tapa</text>
  <path d="M386.0,120.0 L476.0,100.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="386.0" cy="120.0" r="2.8" fill="#4076AA"/>
  <text x="480.0" y="104.0" font-size="13" fill="#62727d">Pin</text>
  <path d="M272.0,122.0 L212.0,122.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
