  <text x="255.4" y="378.0" font-size="14" font-weight="700" fill="#1c2b36" text-anchor="middle">La bola hace tope contra la placa</text>
  <path d="M504.0,242.4 L580.0,300.0" fill="none" stroke="#4076AA" stroke-width="1.5"/>
  <circle cx="504.0" cy="242.4" r="2.8" fill="#4076AA"/>
  <text x="584.0" y="304.0" font-size="13" fill="#62727d">Placa del puente</text>
