  <path d="M330.8,123.9 Q330.8,112.4 360.8,112.4 Q390.8,112.4 390.8,123.9 L390.8,138.0 L330.8,138.0 Z" fill="url(#bone)" stroke="#1c2b36" stroke-width="1.6"/>
  <path d="M340.0,138.0 L345.2,293.5 Q360.8,313.8 376.4,293.5 L381.6,138.0 Z" fill="url(#bone)" stroke="#1c2b36" stroke-width="1.6"/>
