  <text x="570.0" y="412.0" font-size="14" font-weight="700" fill="#1c2b36" text-anchor="middle">para agujeros CON ranura</text>
  <text x="570.0" y="430.0" font-size="12" fill="#62727d" text-anchor="middle">agujero de 5,2 mm, visto desde arriba</text>
