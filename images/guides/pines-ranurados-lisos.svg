<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Inter, Arial, sans-serif">
  <title>Pin ranurado para puentes sin ranura y pin liso para puentes ranurados, a escala</title>
  <defs>
