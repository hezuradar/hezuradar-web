<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Arial, sans-serif">
  <title>Pin ranurado para puentes sin ranura y pin liso para puentes ranurados</title>
  <rect width="720" height="360" fill="#ffffff"/>
  <line x1="360" y1="20" x2="360" y2="340" stroke="#e1e8ed" stroke-width="2"/>
  <!-- Pin ranurado -->
  <g transform="translate(180,0)">
    <text x="0" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2b36">Pin ranurado</text>
    <ellipse cx="0" cy="66" rx="28" ry="10" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
    <path d="M-28,66 L-28,84 Q0,96 28,84 L28,66" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
    <path d="M-17,92 L-9,206 Q0,216 9,206 L17,92 Q0,98 -17,92 Z" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
    <path d="M-4,95 L-2,208 L3,208 L5,95 Z" fill="#c9b48a" stroke="#1c2b36" stroke-width="1"/>
    <text x="34" y="150" font-size="13" fill="#62727d">ranura</text>
    <line x1="32" y1="146" x2="6" y2="146" stroke="#4076AA" stroke-width="1.6"/>
    <!-- Agujero del puente sin ranura -->
    <rect x="-90" y="244" width="180" height="56" rx="8" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
    <circle cx="0" cy="272" r="13" fill="#1c2b36"/>
    <text x="0" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2b36">para agujeros SIN ranura</text>
  </g>
  <!-- Pin liso -->
  <g transform="translate(540,0)">
    <text x="0" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2b36">Pin liso (sin ranurar)</text>
    <ellipse cx="0" cy="66" rx="28" ry="10" fill="#3a2a1c" stroke="#1c2b36" stroke-width="2"/>
    <path d="M-28,66 L-28,84 Q0,96 28,84 L28,66" fill="#3a2a1c" stroke="#1c2b36" stroke-width="2"/>
    <path d="M-17,92 L-9,206 Q0,216 9,206 L17,92 Q0,98 -17,92 Z" fill="#3a2a1c" stroke="#1c2b36" stroke-width="2"/>
    <!-- Agujero del puente con ranura -->
    <rect x="-90" y="244" width="180" height="56" rx="8" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
    <circle cx="0" cy="272" r="13" fill="#1c2b36"/>
    <rect x="-24" y="268" width="14" height="8" fill="#1c2b36"/>
    <text x="-58" y="238" font-size="13" fill="#62727d">ranura en el puente</text>
    <line x1="-28" y1="242" x2="-18" y2="266" stroke="#4076AA" stroke-width="1.6"/>
    <text x="0" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2b36">para agujeros CON ranura</text>
  </g>
</svg>
