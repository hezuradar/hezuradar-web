<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Arial, sans-serif">
  <title>Selleta compensada vista desde arriba: el punto de apoyo de cada cuerda está desplazado</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#62727d">VISTA DESDE ARRIBA · EJEMPLO EN GUITARRA ACÚSTICA</text>
  <!-- Puente -->
  <rect x="150" y="70" width="460" height="150" rx="14" fill="#5a3b22" stroke="#1c2b36" stroke-width="2"/>
  <!-- Selleta -->
  <rect x="190" y="118" width="380" height="26" rx="6" fill="#f6eedc" stroke="#1c2b36" stroke-width="2"/>
  <!-- Línea de apoyo compensada -->
  <polyline points="225,138 275,134 325,130 375,126 425,136 475,124" fill="none" stroke="#4076AA" stroke-width="2" stroke-dasharray="5 4" transform="translate(30,0)"/>
  <g fill="#d9534f" transform="translate(30,0)">
    <circle cx="225" cy="138" r="5"/><circle cx="275" cy="134" r="5"/><circle cx="325" cy="130" r="5"/>
    <circle cx="375" cy="126" r="5"/><circle cx="425" cy="136" r="5"/><circle cx="475" cy="124" r="5"/>
  </g>
  <!-- Cuerdas hacia los pines -->
  <g stroke="#9aa7b0" stroke-width="1.5">
    <line x1="255" y1="54" x2="255" y2="190"/><line x1="305" y1="54" x2="305" y2="190"/><line x1="355" y1="54" x2="355" y2="190"/>
    <line x1="405" y1="54" x2="405" y2="190"/><line x1="455" y1="54" x2="455" y2="190"/><line x1="505" y1="54" x2="505" y2="190"/>
  </g>
  <g fill="#f6eedc" stroke="#1c2b36" stroke-width="1.2">
    <circle cx="255" cy="190" r="7"/><circle cx="305" cy="190" r="7"/><circle cx="355" cy="190" r="7"/>
    <circle cx="405" cy="190" r="7"/><circle cx="455" cy="190" r="7"/><circle cx="505" cy="190" r="7"/>
  </g>
  <g font-size="13" fill="#1c2b36" text-anchor="middle" font-weight="700">
    <text x="255" y="246">6ª</text><text x="305" y="246">5ª</text><text x="355" y="246">4ª</text>
    <text x="405" y="246">3ª</text><text x="455" y="246">2ª</text><text x="505" y="246">1ª</text>
  </g>
  <text x="630" y="96" font-size="13" fill="#62727d">hacia el mástil ↑</text>
  <text x="380" y="280" text-anchor="middle" font-size="13" fill="#62727d">Cada punto rojo es donde apoya la cuerda. Copia el dibujo de tu selleta original.</text>
</svg>
