  <circle cx="570.0" cy="123.0" r="2.8" fill="#4076AA"/>
  <text x="570.0" y="202.0" font-size="13" fill="#62727d" text-anchor="middle">hueso macizo</text>
  <text x="570.0" y="236.0" font-size="13" fill="#33424c" text-anchor="middle">Pieza maciza y densa: transmite</text>
  <text x="570.0" y="255.0" font-size="13" fill="#33424c" text-anchor="middle">mejor la vibración y gana sustain.</text>
  <text x="570.0" y="274.0" font-size="13" fill="#33424c" text-anchor="middle">Más dura: las ranuras conservan</text>
  <text x="570.0" y="293.0" font-size="13" fill="#33424c" text-anchor="middle">su forma durante años.</text>
  <text x="380.0" y="322.0" font-size="12" fill="#62727d" text-anchor="middle">Cejuela de 43 × 9 × 6 mm vista de frente, a escala. El número y la forma de los huecos varía según el fabricante.</text>
</svg>
