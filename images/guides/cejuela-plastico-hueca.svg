  <text x="190.0" y="236.0" font-size="13" fill="#33424c" text-anchor="middle">Muchas son huecas por dentro:</text>
  <text x="190.0" y="255.0" font-size="13" fill="#33424c" text-anchor="middle">menos material para transmitir</text>
  <text x="190.0" y="274.0" font-size="13" fill="#33424c" text-anchor="middle">la vibración. Más blanda: las</text>
  <text x="190.0" y="293.0" font-size="13" fill="#33424c" text-anchor="middle">ranuras se desgastan antes.</text>
  <text x="570.0" y="38.0" font-size="17" font-weight="700" fill="#2e7d4f" text-anchor="middle">Cejuela de hueso</text>
